# ペカセン (pekasen.com) 用の設定テンプレート
#
# ★ 使う前に必ず ★
# ペカセンは自動アクセスをブロックしています（外部からの機械的な取得に403を返す）。
# collect による直接スクレイピングはできません。ブロックをヘッダ偽装などで
# 回避するのは避けてください。
#
# 代わりに、あなたがブラウザで普通に開いて保存したページを取り込みます:
#   1. ブラウザで店舗ページ（例: https://pekasen.com/store/tokyo-100558）を開き
#      Ctrl+S で「ウェブページ、完全」として保存する（inbox/ フォルダへ）
#   2. python -m pachi watch  --config config.pekasen.yaml --inbox inbox
#      （または ingest で1ファイルずつ取り込む）
#   3. python -m pachi report --config config.pekasen.yaml
#
# ingest/watch はページ内の全機種テーブルを自動判定するので、下の columns さえ
# 合っていれば table_selector や pages は使いません（collect専用の項目です）。
# 取り込みがうまくいかない時は inspect で見出しを確認して columns を直します:
#   python -m pachi inspect 保存したファイル.html

hall_name: "メッセ扇店"   # 対象店舗名に変更

# 店舗ページのURL。複数店舗を追いたい場合は店舗ごとに設定ファイルを分ける
base_url: "https://pekasen.com"

user_agent: "pachi-scraper/0.1 (個人利用)"
rate_limit_seconds: 5      # 外部サイトなので長めに
respect_robots_txt: true

# TODO: inspect の結果で置き換える
table_selector: "table"

# 取り込みで使う見出し対応（ペカセンの一般的な項目に合わせた初期値）。
# 取り込み台数が0なら inspect で実際の見出しを確認して直す。
columns:
  unit_no: ["台番号", "台番"]
  bb: ["BB", "BIG"]
  rb: ["RB", "REG"]
  start: ["総回転数", "G数", "総スタート", "累計スタート"]
  diff_medals: ["差枚", "差メダル"]

# 店舗ページ。機種ごとにテーブルが分かれている場合は、同じURLを複数書いて
# ページ個別の table_selector (例: "table:nth-of-type(2)") で振り分ける
pages:
  - name: "ジャグラー全機種"
    url: "store/tokyo-100558"   # TODO: 対象店舗のパスに変更
  # - name: "マイジャグラーV"
  #   url: "store/tokyo-100558"
  #   table_selector: "table:nth-of-type(2)"

db_path: "data/pekasen.db"
